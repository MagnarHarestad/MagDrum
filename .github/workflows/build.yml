name: Windows x64 build
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      build_revision:
        description: Numeric test-build revision
        required: false
        default: "0"
        type: string
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package Windows x64
        shell: pwsh
        env:
          MAGDRUM_BUILD_REVISION: ${{ inputs.build_revision }}
        run: |
          if ($env:MAGDRUM_BUILD_REVISION -notmatch '^\d+$') { throw 'Build revision must be numeric.' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\Build-Windows.ps1 -Architecture x64 -BuildRevision ([int]$env:MAGDRUM_BUILD_REVISION) -Parallel 8
      - uses: actions/upload-artifact@v4
        with:
          name: MagDrum-Windows-x64
          path: latest-publish/MagDrum-Windows-x64.zip
          if-no-files-found: error
