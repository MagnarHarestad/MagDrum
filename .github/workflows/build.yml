name: Build and test
permissions:
  contents: write
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

  windows-vst3-package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --config Release --target MagDrumPlugin_VST3 --parallel 2
      - name: Package plugin and installer script
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter 'MagDrum.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'MagDrum.vst3 bundle was not produced.' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item $plugin.FullName package\MagDrum.vst3 -Recurse
          Copy-Item installer\Install-MagDrum.ps1 package\Install-MagDrum.ps1
          Copy-Item installer\README.txt package\README.txt
          Compress-Archive -Path package\* -DestinationPath latest-publish\MagDrum-Windows-VST3.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          files: latest-publish/MagDrum-Windows-VST3.zip
          generate_release_notes: true
          prerelease: true
