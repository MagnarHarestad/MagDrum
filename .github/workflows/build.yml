name: Build and test
permissions:
  contents: write
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            cmake_arch: x64
          - os: windows-11-arm
            name: windows-arm64
            cmake_arch: ARM64
          - os: macos-15-intel
            name: macos-intel
            osx_arch: x86_64
          - os: macos-latest
            name: macos-arm64
            osx_arch: arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            cmake_arch: x64
            archive: MagDrum-Windows-x64.zip
          - os: windows-11-arm
            name: windows-arm64
            cmake_arch: ARM64
            archive: MagDrum-Windows-ARM64.zip
          - os: macos-15-intel
            name: macos-intel
            osx_arch: x86_64
            archive: MagDrum-macOS-Intel.zip
          - os: macos-latest
            name: macos-arm64
            osx_arch: arm64
            archive: MagDrum-macOS-AppleSilicon.zip
          - os: ubuntu-latest
            name: linux-x64
            archive: MagDrum-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build desktop app and VST3
        run: cmake --build build --config Release --target MagDrum MagDrumPlugin_VST3 --parallel 2
      - name: Build AU
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target MagDrumPlugin_AU --parallel 2
      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Directory -Recurse -Filter 'MagDrum.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'MagDrum.vst3 bundle was not produced.' }
          $app = Get-ChildItem build -File -Recurse -Filter 'MagDrum.exe' | Select-Object -First 1
          if (-not $app) { throw 'MagDrum.exe was not produced.' }
          $directory = 'package/${{ matrix.name }}'
          New-Item -ItemType Directory -Force $directory | Out-Null
          Copy-Item $plugin.FullName "$directory/MagDrum.vst3" -Recurse
          Copy-Item $app.FullName $directory
          Copy-Item installer/Install-MagDrum.ps1 $directory
          Copy-Item installer/README.txt "$directory/README.txt"
          Compress-Archive -Path "$directory/*" -DestinationPath '${{ matrix.archive }}' -Force
      - name: Stage macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/macos
          app="$(find build -type d -name 'MagDrum.app' -print -quit)"
          vst="$(find build -type d -name 'MagDrum.vst3' -print -quit)"
          au="$(find build -type d -name 'MagDrum.component' -print -quit)"
          test -n "$app" && test -n "$vst" && test -n "$au"
          ditto "$app" package/macos/MagDrum.app
          ditto "$vst" package/macos/MagDrum.vst3
          ditto "$au" package/macos/MagDrum.component
          cp installer/README.txt package/macos/README.txt
          ditto -c -k --sequesterRsrc --keepParent package/macos '${{ matrix.archive }}'
      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/linux-x64
          app="$(find build -type f -executable -name 'MagDrum' -print -quit)"
          vst="$(find build -type d -name 'MagDrum.vst3' -print -quit)"
          test -n "$app" && test -n "$vst"
          cp "$app" package/linux-x64/MagDrum
          cp -a "$vst" package/linux-x64/MagDrum.vst3
          tar -C package -czf '${{ matrix.archive }}' linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: MagDrum-${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
